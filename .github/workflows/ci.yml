name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: project_management_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Shared Package
        run: npm run build --workspace=@ismo/shared

      - name: Prisma Generate
        run: npx prisma generate --schema=./apps/api/prisma/schema.prisma

      - name: Build API Service
        run: npm run build --workspace=api

      - name: Build Web Application
        run: npm run build --workspace=web

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/project_management_test?schema=public
        run: npx prisma migrate deploy --schema=./apps/api/prisma/schema.prisma

      - name: Run Integration Tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/project_management_test?schema=public
          JWT_SECRET: ci_pipeline_super_secret_jwt_key
        run: npm run test --workspace=api
