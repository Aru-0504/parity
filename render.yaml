databases:
  - name: parity-db
    databaseName: project_management
    plan: free

services:
  # ---------------------------------------------------------
  # 1. Backend REST API (Node.js + Express + Prisma)
  # ---------------------------------------------------------
  - type: web
    name: parity-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:api
    startCommand: npm run prisma:deploy && npm run start:api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: parity-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: "*"

  # ---------------------------------------------------------
  # 2. Frontend Web App (React + Vite Single-Page App)
  # ---------------------------------------------------------
  - type: web
    name: parity-web
    runtime: static
    plan: free
    buildCommand: npm install && npm run build:web
    staticPublishPath: ./apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: parity-api
          property: host
